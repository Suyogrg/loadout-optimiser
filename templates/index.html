<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Valorant Loadout Optimisation Tool</title>
</head>
<body>
    <h1>Valorant Loadout Optimisation Tool</h1>
    <form method="POST">
        <label for="credits">Available Credits:</label>
        <input type="number" id="credits" name="credits" min="0" required>

        <br><br>

        <label for="agent">Agent:</label>
        <select id="agent" name="agent" required>
            <option value="">Select an agent</option>
            <option value="Jett">Jett</option>
            <option value="Omen">Omen</option>
        </select>

        <br><br>

        <button type="submit">Optimise</button>

    </form>

    {% if selected_agent %}
        <h2>Selected Agent: {{ selected_agent }}</h2>
        <p>Credits: {{ credits }}</p>

        <h3>Available Items</h3>

        <ul>
            {% for item in items %}
                <li>
                    {{ item.name }} - {{ item.cost }} credits
                </li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>

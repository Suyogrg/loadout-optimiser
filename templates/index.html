<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Valorant Loadout Optimisation Tool</title>
</head>
<body>
    <h1>Valorant Loadout Optimisation Tool</h1>
    <form method="POST">
        <label for="credits">Credits:</label>
        <input type="number" id="credits" name="credits" min="0" required>
        <br><br>
        <label for="agent">Agent:</label>
        <select id="agent" name="agent" required>
            <option value="">Select an agent</option>
            {% for agent in agents %}
                <option value="{{ agent }}">{{ agent }}</option>
            {% endfor %}
        </select>
        <br><br>
        <div class="mb-3">
            <label for="offensive">Offensive: <span id="offensive-value">25%</span></label>
            <input type="range" class="form-range" id="offensive" name="offensive" min="0" max="100" value="25">
        </div>
        <div class="mb-3">
            <label for="defensive">Defensive: <span id="defensive-value">25%</span></label>
            <input type="range" class="form-range" id="defensive" name="defensive" min="0" max="100" value="25">
        </div>
        <div class="mb-3">
            <label for="utility">Utility: <span id="utility-value">25%</span></label>
            <input type="range" class="form-range" id="utility" name="utility" min="0" max="100" value="25">
        </div>
        <div class="mb-3">
            <label for="versatility">Versatility: <span id="versatility-value">25%</span></label>
            <input type="range" class="form-range" id="versatility" name="versatility" min="0" max="100" value="25">
        </div>
        <br><br>
        <button type="submit">Optimise</button>
    </form>
    {% if errors %}
    <div>
        <ul>
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</body>
</html>
